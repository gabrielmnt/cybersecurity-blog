---
layout: default
---

<div class="post-page">
  <div class="container">

    <a class="back-link" href="{{ '/' | relative_url }}">Voltar ao blog</a>

    <header class="post-page-header">
      <div class="post-page-meta">
        <span class="post-date">{{ page.date | date: "%d %b %Y" }}</span>
        {% if page.tags and page.tags.size > 0 %}
        <div class="post-tags">
          {% for tag in page.tags %}
          <span class="post-tag">{{ tag }}</span>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <h1 class="post-page-title">{{ page.title }}</h1>
    </header>

    <article class="prose">
      {{ content }}
    </article>

  </div>
</div>
